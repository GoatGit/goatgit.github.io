<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoatGit</title>
  <style>
    :root {
      --ink: #101827;
      --muted: #667085;
      --paper: #f4f6f8;
      --card: #ffffff;
      --line: #d8dde5;
      --accent: #0a1f3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(10,31,61,.055) 1px, transparent 1px),
        linear-gradient(rgba(10,31,61,.045) 1px, transparent 1px),
        var(--paper);
      background-size: 42px 42px;
    }
    main {
      width: min(1120px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 72px 0;
    }
    .eyebrow {
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 18px 0 16px;
      max-width: 820px;
      font-size: clamp(44px, 7vw, 92px);
      line-height: .96;
      letter-spacing: 0;
    }
    .lead {
      max-width: 680px;
      margin: 0 0 48px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }
    .deck {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: end;
      padding: 32px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      box-shadow: 0 24px 70px rgba(16,24,39,.08);
    }
    .meta {
      margin-bottom: 18px;
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h2 {
      margin: 0 0 16px;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.12;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 148px;
      height: 48px;
      padding: 0 22px;
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      white-space: nowrap;
    }
    @media (max-width: 760px) {
      main { width: min(100vw - 28px, 1120px); padding: 40px 0; }
      .deck { grid-template-columns: 1fr; padding: 24px; }
      a.button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">GoatGit · Home</div>
    <h1>AI、产品与长期主义</h1>
    <p class="lead">这里用于展示公开分享、网页 PPT 和产品实验。源材料保持私有，发布产物放在稳定路径下。</p>

    <section class="deck">
      <div>
        <div class="meta">Slides / AI-150 / 28 Pages</div>
        <h2>给 AI 装上方向盘，开向 150 岁的松弛人生</h2>
        <p>一场关于工作、健康、业务与长期成长的 AI 经验分享。当前展示版本为杂志风。</p>
      </div>
      <a class="button" href="./slides/ai-150/">打开 PPT</a>
    </section>
  </main>
</body>
</html>
